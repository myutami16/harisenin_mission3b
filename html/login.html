<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill – Login</title>
    <link rel="stylesheet" href="/css/login-style.css">
    <link rel="icon" href="/assets/movie-clapper-open.png" type="image/png">
</head>
<body>
  <div class="container">
    <div class="background">
    </div>
    <div class="login-wrapper">
      <header class="header">
        <img src="/assets/Logo.png" alt="Logo Chill" class="logo">
      </header>
      <main>
        <form class="form">
          <div class="welcome-container">
            <h3 class="bold">Masuk</h3>
            <p class="semibold">Selamat datang kembali!</p>
          </div>
          <div class="input-group1">
            <label for="username" class="semibold">Username</label>
            <input type="text" name="username" placeholder="Masukkan username" class="medium" required>
          </div>
          <div class="input-group2">
            <label for="password" class="semibold">Kata Sandi</label>
            <div class="password-container">
              <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" class="medium" required>
              <img src="/assets/eye-off.png" alt="Tampilkan/Sembunyikan" class="toggle-password">
            </div>
          </div>          
          <div class="links">
            <div class="signup-links">
              <p class="signup">Belum punya akun? <a href="register.html">Daftar</a></p>
            </div>
            <p class="forgotten"><a href="#">Lupa kata sandi?</a></p>
          </div>
          <div class="button-group">
            <button type="submit" class="btn-login">Masuk</button>
            <p class="semibold">Atau</p>
            <button type="button" class="btn-google"><img src="/assets/google.png" alt="logo-google">Masuk dengan Google</button>
          </div>
        </form>
      </main>
    </div>
  </div>
</body>
</html>
