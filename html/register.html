<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up for Chill</title>
    <link rel="icon" href="assets/movie-clapper-open.png" type="image/png">
</head>
<body>
    <header>
        <img src="assets/Logo.png" alt="Logo Chill">
    </header>
    <main>
        <form>
            <h3>Daftar</h3>
            <p>Selamat datang!</p>
            <label for="username">Username</label>
            <br>
            <input type="text" id="username" name="username" placeholder="Masukkan username">
            <br>
            <label for="password">Kata Sandi</label>
            <br>
            <div class="password-container">
            <input type="password" id="password" name="password" placeholder="Masukkan kata sandi">
            <img src="assets/eye-off.png" alt="eye-off">
            </div>
            <br>
            <label for="password">Konfirmasi Kata Sandi</label>
            <br>
            <div class="password-container">
            <input type="password" id="password" name="password" placeholder="Masukkan kata sandi">
            <img src="assets/eye-off.png" alt="eye-off">
            </div>
        </form>
        <p>Sudah punya akun? <a href="login.html">Masuk</a></p>
    </main>
    <footer>
        <p>&copy; 2024 Chill. All Rights Reserved.</p>
    </footer>
</body>
</html>
